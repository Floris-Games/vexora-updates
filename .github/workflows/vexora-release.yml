name: Build signed Vexora release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    environment: launcher-release
    defaults:
      run:
        working-directory: vexora-update/vexora-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vexora-update/vexora-launcher/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          VEXORA_PUBLISHER: ${{ vars.VEXORA_PUBLISHER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.VEXORA_RELEASE_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Vexora-Windows
          path: |
            vexora-update/vexora-launcher/dist/*.exe
            vexora-update/vexora-launcher/dist/*.blockmap
            vexora-update/vexora-launcher/dist/latest.yml
